<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="lcdGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fa34d"/>
      <stop offset="100%" stop-color="#2d7a38"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <rect x="25" y="20" width="900" height="40" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <circle cx="50" cy="40" r="6" fill="#ef4444"/>
  <circle cx="70" cy="40" r="6" fill="#eab308"/>
  <circle cx="90" cy="40" r="6" fill="#22c55e"/>
  <text x="120" y="45" font-family="'Courier New', monospace" font-size="14" fill="#94a3b8" font-weight="bold">Wokwi Simulator — Predictive Maintenance Bearing Bor (Raspberry Pi Pico W)</text>
  <rect x="760" y="27" width="145" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <circle cx="775" cy="40" r="4" fill="#34d399" filter="url(#glow)"/>
  <text x="788" y="44" font-family="'Segoe UI', sans-serif" font-size="12" fill="#a7f3d0" font-weight="bold">SIMULASI AKTIF</text>

  <!-- LCD 16x2 Component -->
  <g transform="translate(60, 90)">
    <!-- LCD PCB Header -->
    <rect width="400" height="190" rx="10" fill="#047857" stroke="#065f46" stroke-width="3"/>
    <!-- Mounting Holes -->
    <circle cx="16" cy="16" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="384" cy="16" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="16" cy="174" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="384" cy="174" r="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- LCD Bezel -->
    <rect x="35" y="30" width="330" height="130" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <!-- LCD Display Glass (Green Backlight) -->
    <rect x="50" y="45" width="300" height="100" rx="4" fill="url(#lcdGlass)" stroke="#22c55e" stroke-width="2" filter="url(#glow)"/>
    
    <!-- LCD Text Lines (5x8 Dot Matrix Style) -->
    <text x="70" y="88" font-family="'Courier New', monospace" font-size="22" fill="#052e16" font-weight="bold" letter-spacing="2">STATUS: NORMAL  </text>
    <text x="70" y="125" font-family="'Courier New', monospace" font-size="22" fill="#052e16" font-weight="bold" letter-spacing="2">T:27.5C R:0.32g </text>
    
    <text x="145" y="182" font-family="'Segoe UI', sans-serif" font-size="11" fill="#ecfdf5" font-weight="bold">LCD 16x2 I2C (PCF8574 Alamat 0x27)</text>
  </g>

  <!-- Raspberry Pi Pico W Component -->
  <g transform="translate(520, 90)">
    <!-- PCB Board -->
    <rect width="360" height="190" rx="8" fill="#15803d" stroke="#166534" stroke-width="2.5"/>
    <!-- MicroUSB Port -->
    <rect x="145" y="-10" width="70" height="20" rx="3" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
    <rect x="155" y="-5" width="50" height="10" rx="1" fill="#475569"/>
    
    <!-- CYW43439 Wi-Fi Metal Shield -->
    <rect x="135" y="25" width="90" height="65" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="62" font-family="'Segoe UI', sans-serif" font-size="12" fill="#1e293b" font-weight="bold">PICO W</text>
    
    <!-- RP2040 Chip -->
    <rect x="145" y="105" width="70" height="70" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <circle cx="155" cy="115" r="3" fill="#64748b"/>
    <text x="155" y="145" font-family="'Segoe UI', sans-serif" font-size="11" fill="#f8fafc" font-weight="bold">RP2040</text>
    
    <!-- Pin Headers Left & Right -->
    <rect x="10" y="20" width="18" height="150" rx="2" fill="#0f172a"/>
    <rect x="332" y="20" width="18" height="150" rx="2" fill="#0f172a"/>
    
    <!-- Pin Labels -->
    <text x="35" y="40" font-family="'Courier New', monospace" font-size="10" fill="#fef08a">GP15 (Buzzer)</text>
    <text x="35" y="65" font-family="'Courier New', monospace" font-size="10" fill="#86efac">GP16 (DS18B20)</text>
    <text x="35" y="90" font-family="'Courier New', monospace" font-size="10" fill="#93c5fd">GP20 (SDA I2C)</text>
    <text x="35" y="115" font-family="'Courier New', monospace" font-size="10" fill="#fde047">GP21 (SCL I2C)</text>
    <text x="250" y="40" font-family="'Courier New', monospace" font-size="10" fill="#f87171">VBUS (5V LCD)</text>
    <text x="250" y="65" font-family="'Courier New', monospace" font-size="10" fill="#fb923c">3V3 (Sensor)</text>
    <text x="250" y="90" font-family="'Courier New', monospace" font-size="10" fill="#94a3b8">GND Arde</text>
  </g>

  <!-- Bottom Modules Row: DS18B20 + MPU-6050 + Buzzer -->
  <!-- DS18B20 -->
  <g transform="translate(60, 310)">
    <rect width="250" height="105" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="36" height="48" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="18" y="43" font-family="'Segoe UI', sans-serif" font-size="9" fill="#94a3b8" font-weight="bold">DS18B20</text>
    <text x="65" y="35" font-family="'Segoe UI', sans-serif" font-size="14" fill="#38bdf8" font-weight="bold">Sensor Suhu</text>
    <text x="65" y="58" font-family="'Segoe UI', sans-serif" font-size="18" fill="#4ade80" font-weight="bold">27.5 °C</text>
    <text x="65" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Threshold Max: 50.0 °C</text>
    <rect x="15" y="75" width="40" height="18" rx="4" fill="#065f46"/>
    <text x="21" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#34d399" font-weight="bold">NORMAL</text>
  </g>

  <!-- MPU-6050 -->
  <g transform="translate(340, 310)">
    <rect width="280" height="105" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="15" y="15" width="40" height="40" rx="3" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
    <text x="20" y="38" font-family="'Segoe UI', sans-serif" font-size="9" fill="#dbeafe" font-weight="bold">MPU-6050</text>
    <text x="70" y="35" font-family="'Segoe UI', sans-serif" font-size="14" fill="#818cf8" font-weight="bold">Sensor Getaran 3-Sumbu</text>
    <text x="70" y="58" font-family="'Segoe UI', sans-serif" font-size="18" fill="#a5b4fc" font-weight="bold">RMS: 0.32 g | Peak: 0.61 g</text>
    <text x="70" y="80" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Freq Dominan: 25.0 Hz (ISO 10816)</text>
    <rect x="15" y="75" width="40" height="18" rx="4" fill="#065f46"/>
    <text x="21" y="88" font-family="'Segoe UI', sans-serif" font-size="10" fill="#34d399" font-weight="bold">NORMAL</text>
  </g>

  <!-- Buzzer Alarm -->
  <g transform="translate(650, 310)">
    <rect width="230" height="105" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="45" cy="50" r="28" fill="#0f172a" stroke="#e11d48" stroke-width="2"/>
    <circle cx="45" cy="50" r="10" fill="#27272a"/>
    <text x="90" y="38" font-family="'Segoe UI', sans-serif" font-size="14" fill="#fb7185" font-weight="bold">Buzzer Piezo</text>
    <text x="90" y="60" font-family="'Segoe UI', sans-serif" font-size="16" fill="#94a3b8" font-weight="bold">STATUS: OFF</text>
    <text x="90" y="82" font-family="'Segoe UI', sans-serif" font-size="11" fill="#64748b">PWM GP15 (2500 Hz)</text>
  </g>

  <!-- Cloud Status Footer Banner -->
  <g transform="translate(60, 435)">
    <rect width="820" height="95" rx="10" fill="#0f172a" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="20" y="20" width="55" height="55" rx="8" fill="#1e3a8a"/>
    <path d="M 32 50 C 32 44 38 40 44 40 C 47 35 55 35 58 41 C 64 41 68 46 68 51 C 68 56 64 60 58 60 L 36 60 C 33 60 32 56 32 50 Z" fill="#60a5fa"/>
    <text x="90" y="42" font-family="'Segoe UI', sans-serif" font-size="15" fill="#f8fafc" font-weight="bold">ThingsBoard Cloud EU Live Telemetry Transmit</text>
    <text x="90" y="65" font-family="'Courier New', monospace" font-size="12" fill="#38bdf8">MQTT: eu.thingsboard.cloud:1883 | Token: 4M6BoXXbvLbZ5MzS56NS | Status: ACTIVE (200 OK)</text>
    <rect x="680" y="32" width="120" height="30" rx="6" fill="#065f46" stroke="#10b981" stroke-width="1"/>
    <text x="696" y="52" font-family="'Segoe UI', sans-serif" font-size="12" fill="#6ee7b7" font-weight="bold">ONLINE 100%</text>
  </g>
</svg>